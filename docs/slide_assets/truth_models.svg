  </g>
  <g fill="#1f2a2e"><circle cx="930" cy="260" r="8"/><circle cx="980" cy="230" r="8"/><circle cx="1065" cy="280" r="8"/><circle cx="1090" cy="350" r="8"/><circle cx="1010" cy="420" r="8"/><circle cx="905" cy="380" r="8"/></g>
