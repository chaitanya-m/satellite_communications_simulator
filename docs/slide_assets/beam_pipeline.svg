<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#faf8f2"/>
  <circle cx="240" cy="330" r="170" fill="#f2efe5" stroke="#1f2a2e" stroke-width="4"/>
  <text x="240" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#1f2a2e">Beam footprint</text>
  <g fill="#1f2a2e">
    <circle cx="180" cy="260" r="8"/>
    <circle cx="260" cy="220" r="8"/>
    <circle cx="310" cy="320" r="8"/>
    <circle cx="150" cy="360" r="8"/>
    <circle cx="210" cy="410" r="8"/>
    <circle cx="290" cy="430" r="8"/>
    <circle cx="330" cy="270" r="8"/>
    <circle cx="120" cy="300" r="8"/>
    <circle cx="250" cy="350" r="8"/>
    <circle cx="200" cy="190" r="8"/>
  </g>
  <rect x="105" y="205" width="120" height="120" fill="#d97757" fill-opacity="0.45" stroke="#d97757" stroke-width="3"/>
  <text x="165" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8e3b26">blocked zone</text>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2a2e" font-size="30">
    <rect x="470" y="140" rx="18" ry="18" width="220" height="92" fill="#d8ead7" stroke="#2f5d50" stroke-width="3"/>
    <text x="580" y="178" text-anchor="middle">Spatial</text>
    <text x="580" y="214" text-anchor="middle">attenuation model</text>

    <rect x="760" y="140" rx="18" ry="18" width="150" height="92" fill="#d8e5f3" stroke="#2f5d50" stroke-width="3"/>
    <text x="835" y="178" text-anchor="middle">SNR</text>
    <text x="835" y="214" text-anchor="middle">per user</text>

    <rect x="980" y="140" rx="18" ry="18" width="160" height="92" fill="#f7dfb5" stroke="#2f5d50" stroke-width="3"/>
    <text x="1060" y="178" text-anchor="middle">PRBs</text>
    <text x="1060" y="214" text-anchor="middle">per user</text>

    <rect x="690" y="430" rx="18" ry="18" width="250" height="96" fill="#efd6cf" stroke="#2f5d50" stroke-width="3"/>
    <text x="815" y="468" text-anchor="middle">Total beam</text>
    <text x="815" y="504" text-anchor="middle">RB budget</text>
  </g>

  <g stroke="#2f5d50" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M410 330 H435 V186 H462"/>
    <path d="M690 186 H760"/>
    <path d="M910 186 H980"/>
    <path d="M1060 232 V360 H815 V430"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1f2a2e">
    <text x="820" y="615" text-anchor="middle">What changes across models</text>
    <text x="820" y="648" text-anchor="middle">is the spatial attenuation assumption.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f5d50"/>
    </marker>
  </defs>
</svg>
