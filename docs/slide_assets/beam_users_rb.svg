<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#faf8f2"/>

  <defs>
    <linearGradient id="beamFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b39f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#76b39f" stop-opacity="0.18"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f5d50"/>
    </marker>
  </defs>

  <!-- Satellite -->
  <g transform="translate(600,90)">
    <rect x="-48" y="-24" width="96" height="48" rx="10" fill="#d8e5f3" stroke="#2f5d50" stroke-width="4"/>
    <rect x="-160" y="-18" width="96" height="36" rx="6" fill="#e9d6b7" stroke="#2f5d50" stroke-width="3"/>
    <rect x="64" y="-18" width="96" height="36" rx="6" fill="#e9d6b7" stroke="#2f5d50" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#2f5d50"/>
    <line x1="-20" y1="24" x2="-6" y2="44" stroke="#2f5d50" stroke-width="4"/>
    <line x1="20" y1="24" x2="6" y2="44" stroke="#2f5d50" stroke-width="4"/>
    <circle cx="0" cy="50" r="5" fill="#7f4030"/>
  </g>

  <!-- Beam cone -->
  <path d="M600 140 L450 470 L750 470 Z" fill="url(#beamFill)" stroke="#2f5d50" stroke-width="3"/>

  <!-- Ground / beam footprint -->
  <ellipse cx="600" cy="515" rx="250" ry="120" fill="#f2efe5" stroke="#2f5d50" stroke-width="4"/>
  <text x="600" y="655" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1f2a2e">
    Beam footprint with active users
  </text>

  <!-- Users -->
  <g fill="#1f2a2e">
    <circle cx="500" cy="485" r="10"/>
    <circle cx="560" cy="455" r="10"/>
    <circle cx="640" cy="470" r="10"/>
    <circle cx="700" cy="495" r="10"/>
    <circle cx="555" cy="535" r="10"/>
    <circle cx="630" cy="540" r="10"/>
    <circle cx="470" cy="530" r="10"/>
    <circle cx="720" cy="540" r="10"/>
  </g>

  <!-- Highlighted users with RB demand -->
  <circle cx="545" cy="500" r="13" fill="#d97757" stroke="#8e3b26" stroke-width="3"/>
  <circle cx="675" cy="455" r="13" fill="#5a8ec6" stroke="#2b4f74" stroke-width="3"/>

  <g stroke="#2f5d50" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M545 500 C480 455, 420 425, 365 395"/>
    <path d="M675 455 C740 420, 805 385, 870 350"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1f2a2e">
    <rect x="265" y="360" width="130" height="52" rx="12" fill="#f7dfb5" stroke="#2f5d50" stroke-width="3"/>
    <text x="330" y="395" text-anchor="middle">5 RB</text>

    <rect x="860" y="320" width="150" height="52" rx="12" fill="#f7dfb5" stroke="#2f5d50" stroke-width="3"/>
    <text x="935" y="355" text-anchor="middle">10 RB</text>
  </g>

  <text x="600" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1f2a2e">
    One satellite beam serves users with heterogeneous RB demand
  </text>
</svg>
