<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#faf8f2"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f5d50"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2a2e" font-size="24">
    <rect x="60" y="270" width="180" height="100" rx="18" fill="#d8e5f3" stroke="#2f5d50" stroke-width="3"/>
    <text x="150" y="313" text-anchor="middle">PPP user</text>
    <text x="150" y="344" text-anchor="middle">geometry</text>

    <rect x="320" y="270" width="200" height="100" rx="18" fill="#efd6cf" stroke="#2f5d50" stroke-width="3"/>
    <text x="420" y="313" text-anchor="middle">Truth</text>
    <text x="420" y="344" text-anchor="middle">obstruction map</text>

    <rect x="590" y="110" width="220" height="100" rx="18" fill="#f7dfb5" stroke="#2f5d50" stroke-width="3"/>
    <text x="700" y="153" text-anchor="middle">Uniform</text>
    <text x="700" y="184" text-anchor="middle">predicted demand</text>

    <rect x="590" y="270" width="180" height="100" rx="18" fill="#f5ddd6" stroke="#2f5d50" stroke-width="3"/>
    <text x="680" y="313" text-anchor="middle">True total</text>
    <text x="680" y="344" text-anchor="middle">demand</text>

    <rect x="590" y="430" width="220" height="100" rx="18" fill="#d8ead7" stroke="#2f5d50" stroke-width="3"/>
    <text x="700" y="473" text-anchor="middle">Gaussian</text>
    <text x="700" y="504" text-anchor="middle">predicted demand</text>

    <rect x="930" y="240" width="190" height="160" rx="18" fill="#f2efe5" stroke="#2f5d50" stroke-width="3"/>
    <text x="1025" y="295" text-anchor="middle">Compare</text>
    <text x="1025" y="326" text-anchor="middle">absolute</text>
    <text x="1025" y="357" text-anchor="middle">errors</text>
  </g>

  <g stroke="#2f5d50" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M240 320 H320"/>
    <path d="M520 320 H590"/>

    <path d="M150 270 V160 H590"/>
    <path d="M150 370 V480 H590"/>

    <path d="M770 320 H930"/>
    <path d="M810 160 H870 V290 H930"/>
    <path d="M810 480 H870 V350 H930"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#49655d" font-size="20">
    <text x="375" y="145" text-anchor="middle">same geometry -> uniform model</text>
    <text x="372" y="505" text-anchor="middle">same geometry -> Gaussian model</text>
  </g>

  <text x="600" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1f2a2e">
    One trial = one user geometry, one true demand, and two competing model predictions.
  </text>
</svg>
